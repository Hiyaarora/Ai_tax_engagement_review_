[project]
name = "fd-tax-review-backend"
version = "0.1.0"
description = "F&D Tax Engagement Review Agent - FastAPI backend (synthetic data only, decision support not tax advice)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "azure-identity>=1.25.3",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-search-documents>=12.0.0",
    "azure-ai-projects>=2.6.0",
    "openai>=3.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["app", "scripts"]
strict = true
# Azure SDKs ship partial type information; don't fail on their untyped internals.
ignore_missing_imports = true
warn_return_any = false
